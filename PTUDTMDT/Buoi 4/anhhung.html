
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hà Quỳnh Như | Đại Chiến Rồng Già</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #f8fafc;
  background: #080e20;
}
header {
  padding: 18px 5%;
  display: flex;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
  background: #101b36;
  border-bottom: 1px solid #344568;
}
.logo { color: #facc15; font-weight: 900; }
.student { color: #cbd5e1; font-size: 14px; }
main { max-width: 1150px; margin: auto; padding: 24px 16px; }
h1 { text-align: center; font-size: clamp(28px,5vw,48px); margin: 12px 0; }
h1 span { color: #fb923c; }
.subtitle { text-align: center; color: #a9b8d2; }
.panel {
  background: #121d37;
  border: 1px solid #354563;
  border-radius: 18px;
  padding: 20px;
  margin: 20px 0;
}
.setup { display: flex; gap: 18px; align-items: end; flex-wrap: wrap; }
.field { flex: 1; min-width: 190px; }
label { display: block; margin-bottom: 8px; font-weight: bold; }
input, select {
  width: 100%; padding: 13px; border-radius: 9px;
  background: #071127; color: white; border: 1px solid #536580;
}
button {
  border: 0; border-radius: 10px; padding: 14px 20px;
  font-weight: bold; cursor: pointer; color: white;
  background: #2563eb;
}
button:disabled { opacity: .45; cursor: not-allowed; }
button:hover:not(:disabled) { filter: brightness(1.15); }
#resetBtn { background: #475569; }
#soundBtn { background: #334155; }
.arena-head {
  display: flex; justify-content: space-between;
  gap: 10px; flex-wrap: wrap; color: #facc15; font-weight: bold;
}
.hud { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 20px; }
.hud-name { display: flex; justify-content: space-between; gap: 8px; font-weight: bold; }
.hp-track {
  height: 17px; background: #334155; border-radius: 20px;
  overflow: hidden; margin-top: 9px;
}
.hp-fill { height: 100%; width: 100%; transition: width .5s; }
#heroBar { background: linear-gradient(90deg,#16a34a,#86efac); }
#dragonBar { background: linear-gradient(90deg,#b91c1c,#fb923c); }
.stage {
  position: relative; height: 410px; margin-top: 22px;
  overflow: hidden; border-radius: 16px;
  background:
    radial-gradient(ellipse at 50% 80%,#743c31 0%,transparent 55%),
    linear-gradient(#10162e 0%,#322641 58%,#3d292c 76%,#1b1823 100%);
  border: 1px solid #654c57;
}
.moon {
  position: absolute; top: 35px; left: 48%;
  width: 80px; height: 80px; border-radius: 50%;
  background: #f9dca2; box-shadow: 0 0 75px #fbbf2470;
}
.floor {
  position: absolute; bottom: 0; width: 100%; height: 23%;
  background: repeating-linear-gradient(100deg,#33282c,#33282c 35px,#483037 37px);
  border-top: 5px solid #775348;
}
.character {
  position: absolute; bottom: 17%; height: 245px;
  display: flex; justify-content: center; align-items: end;
  transition: filter .2s;
  z-index: 2;
}
.hero { left: 9%; width: 30%; }
.hero img {
  width: 100%; height: 100%; object-fit: contain;
  filter: drop-shadow(0 10px 15px #000);
}
.dragon { right: 5%; width: 40%; }
.dragon svg {
  width: 100%; height: 100%; overflow: visible;
  filter: drop-shadow(0 12px 12px #000);
}
.ground-shadow {
  position: absolute; bottom: -8px; width: 75%; height: 16px;
  background: #0009; border-radius: 50%; filter: blur(5px);
}
.hero.attack { animation: heroAttack .65s ease-in-out; }
.dragon.attack { animation: dragonAttack .65s ease-in-out; }
.hurt { animation: hurt .5s ease-in-out; }
.dodge { animation: dodge .5s ease-in-out; }
@keyframes heroAttack {
  0%,100% { transform: translateX(0); }
  48% { transform: translateX(110px) scale(1.1); }
}
@keyframes dragonAttack {
  0%,100% { transform: translateX(0); }
  48% { transform: translateX(-65px); }
}
@keyframes hurt {
  0%,100% { filter: none; transform: translateX(0); }
  25%,75% { filter: brightness(3) sepia(1) saturate(8); }
  50% { transform: translateX(-15px); }
}
@keyframes dodge {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-65px); }
}
.projectile {
  position: absolute; left: 30%; top: 45%; z-index: 4;
  width: 48px; height: 48px; border-radius: 50%;
  opacity: 0; pointer-events: none;
}
.shield {
  border: 9px solid #ef4444;
  background: radial-gradient(circle,#fff 0 20%,#2563eb 22% 55%,#fff 57%);
  box-shadow: 0 0 25px #60a5fa;
}
.fire {
  left: 72%; width: 65px; height: 65px;
  background: radial-gradient(circle,#fff7ad,#f97316 45%,#dc2626 75%,transparent);
  box-shadow: 0 0 40px #f97316;
}
.shield.fly { animation: shieldFly .7s ease-in forwards; }
.fire.fly { animation: fireFly .7s ease-in forwards; }
@keyframes shieldFly {
  0% { opacity: 1; left: 30%; transform: rotate(0); }
  100% { opacity: 1; left: 70%; transform: rotate(720deg); }
}
@keyframes fireFly {
  0% { opacity: 1; left: 72%; transform: scale(.5); }
  100% { opacity: 1; left: 25%; transform: scale(1.5); }
}
.damage {
  position: absolute; top: 27%; z-index: 6;
  font-size: 36px; font-weight: 900;
  color: #facc15; text-shadow: 2px 3px #000;
  opacity: 0; pointer-events: none;
}
.damage.show { animation: floatDamage 1.2s forwards; }
@keyframes floatDamage {
  0% { opacity: 0; transform: translateY(20px) scale(.7); }
  25% { opacity: 1; transform: translateY(0) scale(1.3); }
  100% { opacity: 0; transform: translateY(-75px); }
}
.flash {
  position: absolute; inset: 0; z-index: 5;
  background: #fff; opacity: 0; pointer-events: none;
}
.flash.active { animation: flash .4s; }
@keyframes flash { 30% { opacity: .65; } }
.stage.shake { animation: shake .35s; }
@keyframes shake {
  25% { transform: translateX(-7px); }
  50% { transform: translateX(8px); }
  75% { transform: translateX(-5px); }
}
.controls {
  display: flex; gap: 10px; flex-wrap: wrap;
  justify-content: center; margin-top: 18px;
}
.log {
  margin-top: 18px; background: #080f21;
  border-radius: 12px; padding: 15px;
  height: 145px; overflow-y: auto;
  color: #cbd5e1; font-size: 14px;
}
.log p { margin: 6px 0; }
.result {
  text-align: center; font-size: 28px; font-weight: 900;
  margin-top: 16px; color: #facc15;
}
.stats { text-align: center; color: #a8b8d5; margin-top: 12px; }
footer { text-align: center; color: #64748b; padding: 20px; }
@media(max-width:600px) {
  .stage { height: 310px; }
  .character { height: 170px; }
  .hero { left: 3%; width: 40%; }
  .dragon { right: 1%; width: 48%; }
  .damage { font-size: 25px; }
  .hud { gap: 12px; font-size: 12px; }
}
</style>
</head>
<body>
<header>
  <div class="logo">⚡ ANH HÙNG JAVASCRIPT</div>
  <div class="student">HÀ QUỲNH NHƯ · MSSV: 31241026992</div>
</header>

<main>
  <h1>ĐẠI CHIẾN <span>RỒNG GIÀ</span></h1>
  <p class="subtitle">QUEST 5 · Đấu trường sinh tử</p>

  <section class="panel setup">
    <div class="field">
      <label for="heroName">Tên anh hùng</label>
      <input id="heroName" value="Hà Quỳnh Như">
    </div>
    <div class="field">
      <label for="heroClass">Phân cấp</label>
      <select id="heroClass">
        <option value="a">Chiến Binh</option>
        <option value="b">Sát Thủ</option>
        <option value="c">Thợ Săn</option>
      </select>
    </div>
    <button id="startBtn">⚔️ BẮT ĐẦU</button>
  </section>

  <section class="panel">
    <div class="arena-head">
      <span id="status">ĐẤU TRƯỜNG · SẴN SÀNG</span>
      <span>LEVEL 5</span>
    </div>

    <div class="hud">
      <div>
        <div class="hud-name">
          <span id="heroLabel">HÀ QUỲNH NHƯ</span>
          <span id="heroHp">105 / 105</span>
        </div>
        <div class="hp-track"><div class="hp-fill" id="heroBar"></div></div>
      </div>
      <div>
        <div class="hud-name">
          <span>🐉 RỒNG GIÀ</span>
          <span id="dragonHp">600 / 600</span>
        </div>
        <div class="hp-track"><div class="hp-fill" id="dragonBar"></div></div>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="moon"></div>
      <div class="floor"></div>

      <div class="character hero" id="hero">
        <span class="ground-shadow"></span>
        <img src="anhung.webp" alt="Captain America">
      </div>

      <div class="character dragon" id="dragon">
        <span class="ground-shadow"></span>
        <svg viewBox="0 0 350 300" role="img" aria-label="Rồng Già">
          <defs>
            <linearGradient id="dragonSkin" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f97316"/>
              <stop offset=".55" stop-color="#b91c1c"/>
              <stop offset="1" stop-color="#450a0a"/>
            </linearGradient>
          </defs>
          <path d="M95 160 Q25 25 5 80 Q45 90 55 175Z"
                fill="#7f1d1d" stroke="#fb923c" stroke-width="5"/>
          <path d="M220 160 Q290 10 345 75 Q290 95 270 185Z"
                fill="#991b1b" stroke="#fb923c" stroke-width="5"/>
          <path d="M215 220 Q315 225 340 270 Q260 265 195 245Z"
                fill="#991b1b"/>
          <ellipse cx="175" cy="185" rx="95" ry="90"
                   fill="url(#dragonSkin)" stroke="#7f1d1d" stroke-width="5"/>
          <path d="M120 180 Q170 150 220 180 L215 255 Q170 280 125 245Z"
                fill="#fdba74"/>
          <path d="M125 105 L145 60 L163 107 L190 48 L205 110 L235 70 L235 135"
                fill="#facc15"/>
          <path d="M110 115 Q145 60 210 100 L255 125 L280 160
                   L250 195 L210 180 L145 180 Q90 170 110 115Z"
                fill="url(#dragonSkin)" stroke="#7f1d1d" stroke-width="5"/>
          <path d="M235 165 L290 185 L245 198 L210 180Z" fill="#7f1d1d"/>
          <circle cx="224" cy="143" r="9" fill="#fef08a"/>
          <circle cx="226" cy="143" r="4" fill="#111827"/>
          <path d="M100 245 L80 285 L115 285 L145 250
                   M215 245 L235 285 L270 285 L245 240"
                fill="#991b1b" stroke="#7f1d1d" stroke-width="6"/>
          <path d="M80 285 L72 295 M115 285 L120 295
                   M235 285 L230 295 M270 285 L278 295"
                stroke="#fef3c7" stroke-width="6"/>
        </svg>
      </div>

      <div class="projectile shield" id="shield"></div>
      <div class="projectile fire" id="fire"></div>
      <div class="damage" id="damage"></div>
      <div class="flash" id="flash"></div>
    </div>

    <p class="stats" id="stats">Chọn phân cấp để xem chỉ số.</p>

    <div class="controls">
      <button id="attackBtn" disabled>⚔️ TẤN CÔNG</button>
      <button id="autoBtn" disabled>▶ TỰ ĐỘNG</button>
      <button id="soundBtn">🔊 ÂM THANH: BẬT</button>
      <button id="resetBtn">↻ CHƠI LẠI</button>
    </div>

    <div class="log" id="log" aria-live="polite">
      <p>Hãy bắt đầu trận chiến!</p>
    </div>
    <div class="result" id="result"></div>
  </section>
</main>
<footer>HTML · CSS · JAVASCRIPT | HÀ QUỲNH NHƯ © 2026</footer>
<script src="anhhung.js"></script>
</body>
</html>
